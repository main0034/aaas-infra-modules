name: validate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (module)
        working-directory: modules/app-stack
        run: terraform init -backend=false

      - name: terraform validate (module)
        working-directory: modules/app-stack
        run: terraform validate

      - name: terraform init (example)
        working-directory: examples/minimal
        run: terraform init -backend=false

      - name: terraform validate (example)
        working-directory: examples/minimal
        run: terraform validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - run: tflint --init

      # Explicit per-directory runs rather than --recursive. With --recursive
      # tflint re-discovers configuration in each directory it visits, so a
      # single root .tflint.hcl is not reliably applied and failures are hard
      # to attribute. --chdir with an explicit --config removes the ambiguity.
      - name: tflint (module)
        run: tflint --chdir=modules/app-stack --config="$(pwd)/.tflint.hcl" --minimum-failure-severity=error

      - name: tflint (example)
        run: tflint --chdir=examples/minimal --config="$(pwd)/.tflint.hcl" --minimum-failure-severity=error

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: modules/app-stack
          config_file: .checkov.yml
          quiet: true
          soft_fail: true # POC: report only. Flip to false once .checkov.yml skips are revisited.

  # The single check to mark as required in branch protection, mirroring the
  # 'gate' job in aaas-deployments. One name to configure in both repos, and
  # adding a job here never means revisiting the protection settings.
  gate:
    needs: [terraform, tflint, checkov]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          set -euo pipefail
          echo "terraform: ${{ needs.terraform.result }}"
          echo "tflint:    ${{ needs.tflint.result }}"
          echo "checkov:   ${{ needs.checkov.result }}"

          for result in \
            "${{ needs.terraform.result }}" \
            "${{ needs.tflint.result }}" \
            "${{ needs.checkov.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job did not succeed."; exit 1 ;;
            esac
          done

          echo "All checks passed."
